name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'module.json'
  workflow_dispatch:
    inputs:
      foundry_dry_run:
        description: 'Foundry package release API: validate only, do not save'
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version-changed: ${{ steps.check-version.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: get-version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check-version
        run: |
          git diff HEAD^ HEAD -- module.json > diff.txt || true
          if grep -q '"version"' diff.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get module info
        id: module-info
        run: |
          VERSION=$(jq -r '.version' module.json)
          TITLE=$(jq -r '.title' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Update module.json URLs for this release
        run: |
          VERSION=${{ steps.module-info.outputs.version }}
          REPO=${{ github.repository }}
          jq \
            --arg manifest "https://github.com/${REPO}/releases/latest/download/module.json" \
            --arg download "https://github.com/${REPO}/releases/download/v${VERSION}/module.zip" \
            '.manifest = $manifest | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            ImageDatabase_clean.json \
            scripts/ \
            styles/ \
            templates/ \
            README.md \
            LICENSE
          unzip -l module.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.module-info.outputs.version }}
          name: ${{ steps.module-info.outputs.title }} v${{ steps.module-info.outputs.version }}
          body: |
            ## ${{ steps.module-info.outputs.title }} v${{ steps.module-info.outputs.version }}

            ### Installation
            Install the latest version with this manifest URL:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/module.json
            ```
            Or download `module.zip` and install manually.

            ### Compatibility
            - Foundry VTT v13+
          files: |
            module.zip
            module.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the version to Foundry's package registry
      # https://foundryvtt.com/article/package-release-api/
      # Needs repo secret FOUNDRY_RELEASE_TOKEN (the "Package Release Token" on
      # the package's foundryvtt.com edit page). Manifest must be the
      # version-pinned URL, not "latest". Compatibility is read from module.json.
      # Max one release per package per 60s -> retry once on 429.
      - name: Publish to Foundry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.foundry_dry_run || false }}
        run: |
          if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
            echo "::error::Secret FOUNDRY_RELEASE_TOKEN is not set"
            exit 1
          fi

          VERSION="${{ steps.module-info.outputs.version }}"
          REPO="${{ github.repository }}"

          BODY=$(jq -n \
            --arg id "$(jq -r .id module.json)" \
            --arg version "$VERSION" \
            --arg manifest "https://github.com/${REPO}/releases/download/v${VERSION}/module.json" \
            --arg notes "https://github.com/${REPO}/releases/tag/v${VERSION}" \
            --arg min "$(jq -r '.compatibility.minimum // ""' module.json)" \
            --arg ver "$(jq -r '.compatibility.verified // ""' module.json)" \
            --arg max "$(jq -r '.compatibility.maximum // ""' module.json)" \
            --argjson dry "$DRY_RUN" \
            '{id: $id, "dry-run": $dry, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: {minimum: $min, verified: $ver, maximum: $max}}}')
          echo "Request body:"; echo "$BODY"

          for attempt in 1 2; do
            HTTP=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST 'https://foundryvtt.com/_api/packages/release_version/' \
              -H 'Content-Type: application/json' \
              -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
              -d "$BODY" -D headers.txt)
            echo "HTTP $HTTP"; cat response.json; echo
            if [ "$HTTP" = "429" ] && [ "$attempt" = "1" ]; then
              WAIT=$(grep -i '^retry-after:' headers.txt | tr -dc '0-9')
              echo "Rate limited, waiting ${WAIT:-60}s"
              sleep "${WAIT:-60}"
              continue
            fi
            break
          done

          if [ "$HTTP" != "200" ]; then
            echo "::error::Foundry release API returned HTTP $HTTP"
            exit 1
          fi
